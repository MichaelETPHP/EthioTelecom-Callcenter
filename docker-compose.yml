name: ethio-sms-platform

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # No host port binding and no ACME here on purpose: Coolify's own
    # Traefik proxy owns ports 80/443 and terminates HTTPS. Assign the
    # real domain to THIS service in Coolify's UI - it forwards plain
    # HTTP to whatever port is exposed below, and this Caddy instance
    # just does internal /call and /sms-api path routing behind it.
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - call
      - sms-gateway-backend

  call:
    build:
      context: .
      dockerfile: call/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - call_data:/app/data
    expose:
      - "5000"

  sms-gateway-backend:
    build:
      context: .
      dockerfile: sms-gateway-server/build/package/Dockerfile
      args:
        - APP=sms-gateway
    restart: unless-stopped
    volumes:
      - ./sms-gateway-server/configs/config.yml:/app/config.yml:ro
    environment:
      - CONFIG_PATH=config.yml
    expose:
      - "3000"

  sms-gateway-worker:
    build:
      context: .
      dockerfile: sms-gateway-server/build/package/Dockerfile
      args:
        - APP=sms-gateway
    command: ["/app/app", "worker"]
    restart: unless-stopped
    volumes:
      - ./sms-gateway-server/configs/config.yml:/app/config.yml:ro
    environment:
      - CONFIG_PATH=config.yml

volumes:
  caddy_data:
  caddy_config:
  call_data:
